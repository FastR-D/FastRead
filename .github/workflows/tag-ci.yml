name: Validate and deploy FastRead

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: validate-fastread-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend-go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: go test -race ./... && go vet ./...
        working-directory: backend-go
      - run: mkdir -p ../bin && go build -trimpath -o ../bin/fastread ./cmd/fastread
        working-directory: backend-go
        env:
          CGO_ENABLED: '0'
      - run: bash deploy/web/package-poppler.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: fastread-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm run lint && pnpm run typecheck && pnpm test && pnpm run build
        working-directory: fastread-frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_SCREENSHOT_BASE_URL: /static/screenshots
      - name: Checkout pinned FastDeploy packager
        uses: actions/checkout@v4
        with:
          repository: FastR-D/FastDeploy
          ref: f26800df4c31534c66691d7d8e9844042321c558
          path: .fastdeploy-tools
          persist-credentials: false
      - name: Package the tested runtime
        run: python3 .fastdeploy-tools/scripts/package.py fastread --output "$RUNNER_TEMP/fastread-release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/fastread-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: FastR-D/FastDeploy/.github/workflows/deploy.yml@f26800df4c31534c66691d7d8e9844042321c558
    with:
      app: fastread
      artifact-name: release-${{ github.sha }}
      # These values are literal KEY=value entries; do not add shell quotes.
      # Code-relative paths are supplied by the trusted FastDeploy server profile.
      runtime-env: |
        APP_PORT=3015
        ARXIV_GATEWAY_URL=https://8-219-149-159.sslip.io
        BACKEND_HOST=127.0.0.1
        BACKEND_PORT=8584
        CHAT_EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        CHAT_EMBEDDING_MODEL_REVISION=faf4aa4225822f3bc6376869cb1164e8e3feedd0
        CHAT_EMBEDDING_REPOSITORY=qdrant/paraphrase-multilingual-MiniLM-L12-v2-onnx-Q
        CHAT_VECTOR_INDEX_ENABLED=auto
        CROSSREF_API_URL=https://api.crossref.org/works
        ELASTICSEARCH_URL=http://127.0.0.1:9200
        ENV=development
        FASTREAD_COOKIE_SECURE=true
        FASTREAD_DATA_ROOT=/home/dev/fastread-web-shared/compatibility
        FASTREAD_DEFAULT_MODEL=qwen3.8-27b
        FASTREAD_DEFAULT_PROVIDER=qwen
        FASTREAD_FASTCAS_ALLOW_LOOPBACK_HTTP=false
        FASTREAD_FASTCAS_CLIENT_ID=fastread
        FASTREAD_FASTCAS_ISSUER=https://cas.fastrd.io
        FASTREAD_FASTCAS_REDIRECT_URI=https://read.fastrd.io/api/auth/fastcas/callback
        FASTREAD_PUBLIC_ORIGIN=https://read.fastrd.io
        FASTREAD_FASTNEWS_URL=http://127.0.0.1:8788
        FASTREAD_FASTWRITE_URL=http://127.0.0.1:3003
        FASTREAD_WEB_ROOT=/home/dev/fastread-web-shared/data
        FASTRESEARCH_API_URL=http://127.0.0.1:8787
        FASTRESEARCH_PANEL_URL=https://fastrd.io
        GROQ_TRANSCRIBER_MODEL=whisper-large-v3-turbo
        HF_ENDPOINT=https://hf-mirror.com
        IMAGE_BASE_URL=/static/screenshots
        NOTE_OUTPUT_DIR=note_results
        ONLINE_VERIFY_SEARCH_FALLBACK_PROVIDERS=bing_academic,bing_cn,baidu
        ONLINE_VERIFY_SEARCH_PROVIDER=brave
        OPENALEX_API_URL=https://api.openalex.org/works
        OUT_DIR=./static/screenshots
        PAPER_SEARCH_ES_REPLICAS=0
        PAPER_SEARCH_REQUIRE_PROXY=false
        STATIC=/static
        TRANSCRIBER_TYPE=bcut
        VITE_API_BASE_URL=/api
        VITE_FRONTEND_PORT=3015
        VITE_SCREENSHOT_BASE_URL=/static/screenshots
        WHISPER_MODEL_SIZE=tiny
    secrets:
      SSH_HOST: ${{ secrets.FASTRD_SSH_HOST }}
      SSH_PORT: ${{ secrets.FASTRD_SSH_PORT }}
      SSH_USER: ${{ secrets.FASTRD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.FASTRD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.FASTRD_SSH_KNOWN_HOSTS }}
      runtime-secrets: |
        {
          "ARXIV_GATEWAY_API_KEY": ${{ toJSON(secrets.ARXIV_GATEWAY_API_KEY) }},
          "DATABASE_URL": ${{ toJSON(secrets.DATABASE_URL) }},
          "FASTREAD_FASTCAS_CLIENT_SECRET": ${{ toJSON(secrets.FASTREAD_FASTCAS_CLIENT_SECRET) }}
        }
