name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend-tests:
    name: Backend tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run pytest
        env:
          TMP: ${{ github.workspace }}\.tmp
          TEMP: ${{ github.workspace }}\.tmp
        run: |
          New-Item -ItemType Directory -Force .tmp | Out-Null
          python -m pytest

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastread-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: fastread-frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm run lint

      - name: Type-check frontend
        run: pnpm run typecheck

      - name: Test frontend when a suite is defined
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm run test
          else
            echo "No frontend test script is defined; no tests were run."
          fi

      - name: Build frontend
        run: pnpm run build

  docker-compose-config:
    name: Docker compose config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: |
          docker compose --env-file /dev/null -f docker-compose.yml config
          docker compose --env-file /dev/null -f docker-compose.gpu.yml config
