version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend-go
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fastread-frontend
    # Major API migrations require a dedicated implementation and browser acceptance.
    ignore:
      - dependency-name: "@ant-design/x"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@lobehub/icons"
        update-types: ["version-update:semver-major"]
      - dependency-name: antd
        update-types: ["version-update:semver-major"]
      - dependency-name: lottie-react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-resizable-panels
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-react-hooks
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fastread-frontend/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      pip-dependencies:
        patterns: ["*"]
