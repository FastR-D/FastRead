version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend-go
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fastread-frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fastread-frontend/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      pip-dependencies:
        patterns: ["*"]
