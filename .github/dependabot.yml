version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend-go
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /fastread-frontend
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /fastread-frontend/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-dependencies:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    # fastembed 0.9.1 requires huggingface-hub <2; Celery 5.7 pins dateutil 2.9.0.post0.
    ignore:
      - dependency-name: huggingface-hub
        versions: [">=2"]
      - dependency-name: python-dateutil
        versions: [">=3"]
    schedule:
      interval: weekly
    groups:
      pip-dependencies:
        patterns: ["*"]
