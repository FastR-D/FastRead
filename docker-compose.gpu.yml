
services:
  backend:
    container_name: reel-mind-backend
    build:
      context: .
      dockerfile: backend/Dockerfile.gpu
      args:
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8483}
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
    volumes:
      - ./backend:/app
    expose:
      - "${BACKEND_PORT:-8483}"  # 不再对外暴露，用于 nginx 内部通信
    deploy:
      resources:
        reservations:
          devices:
            - driver: "nvidia"
              count: "all"
              capabilities: ["gpu"]

  frontend:
    container_name: reel-mind-frontend
    build:
      context: .
      dockerfile: reel-mind-frontend/Dockerfile
    env_file:
      - .env
    expose:
      - "80"  # 不暴露给宿主机，只供 nginx 访问

  nginx:
    container_name: reel-mind-nginx
    image: ${NGINX_RUNTIME_IMAGE:-mirror.gcr.io/library/nginx:1.25-alpine}
    ports:
      - "${APP_PORT:-3015}:80"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8483}
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template
    depends_on:
      - backend
      - frontend
