map "$cookie_fastread_session:$arg_sso" $fastread_bounce {
  default 0;
  ":" 1;
}

server {
  listen 80;
  client_max_body_size 10G;

  # gzip 压缩
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Document entry is FastResearch-only. Static assets stay reachable so ?sso= can boot the SPA.
  location = / {
    if ($fastread_bounce) {
      return 302 ${FASTRESEARCH_PANEL_URL};
    }
    proxy_pass http://frontend:80;
  }

  location = /index.html {
    if ($fastread_bounce) {
      return 302 ${FASTRESEARCH_PANEL_URL};
    }
    proxy_pass http://frontend:80;
  }

  location ~* \.html?$ {
    if ($fastread_bounce) {
      return 302 ${FASTRESEARCH_PANEL_URL};
    }
    proxy_pass http://frontend:80;
  }

  # 所有非 /api 请求全部代理给 frontend 容器
  location / {
    proxy_pass http://frontend:80;
  }

  # 所有 /api 请求代理给 backend 容器
  location = /api/verify_task_online {
    proxy_pass http://backend:${BACKEND_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 30s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location /api/ {
    proxy_pass http://backend:${BACKEND_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
  }

  location /static/ {
    proxy_pass http://backend:${BACKEND_PORT}/static/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  location /uploads/ {
    proxy_pass http://backend:${BACKEND_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
