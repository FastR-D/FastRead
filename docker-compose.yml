services:
  backend:
    image: fastread-api:local
    build:
      context: .
      dockerfile: backend-go/Dockerfile
    command: ["serve", "--listen", "0.0.0.0:8483"]
    environment: &runtime
      FASTREAD_WEB_ROOT: /var/lib/fastread/web
      FASTREAD_DATA_ROOT: /var/lib/fastread/config
      FASTREAD_COOKIE_SECURE: ${FASTREAD_COOKIE_SECURE:-false}
      FASTREAD_PUBLIC_ORIGIN: ${FASTREAD_PUBLIC_ORIGIN:-http://127.0.0.1:3015}
      FASTREAD_FASTNEWS_URL: ${FASTREAD_FASTNEWS_URL:-https://news.fastrd.io}
      FASTREAD_FASTWRITE_URL: ${FASTREAD_FASTWRITE_URL:-https://write.fastrd.io}
    volumes:
      - fastread-data:/var/lib/fastread
    expose: ["8483"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8483/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    image: fastread-api:local
    command: ["worker", "--concurrency", "2"]
    environment: *runtime
    volumes:
      - fastread-data:/var/lib/fastread
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: fastread-frontend/Dockerfile
    expose: ["80"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-3015}:80"
    environment:
      BACKEND_PORT: "8483"
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  fastread-data:
