
services:
  backend:
    container_name: reel-mind-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-mirror.gcr.io/library/python:3.11-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    env_file:
      - .env
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8483}
      - BACKEND_HOST=${BACKEND_HOST:-0.0.0.0}
    volumes:
      - ./backend:/app
    expose:
      - "${BACKEND_PORT:-8483}"  # 不再对外暴露，用于 nginx 内部通信
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${BACKEND_PORT:-8483}/api/sys_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    mem_limit: 4g

  frontend:
    container_name: reel-mind-frontend
    build:
      context: .
      dockerfile: reel-mind-frontend/Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-mirror.gcr.io/library/node:20-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-mirror.gcr.io/library/nginx:1.25-alpine}
    env_file:
      - .env
    expose:
      - "80"  # 不暴露给宿主机，只供 nginx 访问
    restart: on-failure:3
    mem_limit: 512m

  nginx:
    container_name: reel-mind-nginx
    image: ${NGINX_RUNTIME_IMAGE:-mirror.gcr.io/library/nginx:1.25-alpine}
    ports:
      - "${APP_PORT:-3015}:80"
    environment:
      - BACKEND_PORT=${BACKEND_PORT:-8483}
    volumes:
      - ./nginx/default.conf:/etc/nginx/templates/default.conf.template
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: on-failure:3
    mem_limit: 256m
